<svg width="3000" height="1000" viewBox="0 0 3000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0C2418"/>
      <stop offset="55%" stop-color="#071009"/>
      <stop offset="100%" stop-color="#04080A"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00D18C"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="3000" height="1000" fill="url(#bg)"/>

  <!-- doorlopende stroom over de hele banner -->
  <g filter="url(#bigglow)" opacity="0.8">
    <path d="M -50 560 C 500 560, 700 500, 1020 500 C 1340 500, 1500 560, 2050 560 C 2500 560, 2700 520, 3050 520"
          stroke="url(#flow)" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>

  <!-- poort-merk -->
  <g filter="url(#glow)">
    <path d="M 900 640 L 900 460 A 120 120 0 0 1 1140 460 L 1140 640"
          stroke="url(#neon)" stroke-width="34" stroke-linecap="round" fill="none"/>
  </g>
  <circle cx="1020" cy="500" r="18" fill="#B8FFE9" filter="url(#glow)"/>

  <!-- wordmark -->
  <text x="1250" y="530" font-family="DejaVu Sans, sans-serif" font-size="150" font-weight="bold" fill="#EAFFF6" letter-spacing="-4">passage<tspan fill="#00FFA3">.</tspan></text>
  <text x="1258" y="640" font-family="DejaVu Sans, sans-serif" font-size="46" fill="#7DA395" letter-spacing="6">MAKE YOUR RWAs DeFi-COMPOSABLE</text>

  <!-- chips rechtsboven -->
  <text x="2960" y="150" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="38" fill="#00FFA3" letter-spacing="8">SOLANA · TOKEN-2022 · REAL YIELD</text>
</svg>
