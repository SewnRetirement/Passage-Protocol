[workspace]
members = [
    "programs/passage_identity",
    "programs/passage_hook",
    "programs/passage_wrapper",
    "programs/passage_pool",
    "programs/passage_demo_faucet",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
